name: mirror-source
on:
  workflow_dispatch:
    inputs:
      src_repo:
        description: "source repo (owner/name)"
        required: true
        default: "balsicl1234/hermes-cloud"
      dst_repo:
        description: "destination repo (owner/name)"
        required: true
        default: "balsickass/hermes-cloud-backup"
permissions:
  contents: write
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Mirror all branches, VERBOSE
        run: |
          SRC="${{ github.event.inputs.src_repo }}"
          DST="${{ github.event.inputs.dst_repo }}"
          PAT="${{ secrets.SRC_TOKEN }}"
          echo "test auth to DST:"
          git ls-remote "https://x-access-token:$PAT@github.com/$DST.git" HEAD 2>&1 | head -3
          echo "---"
          for b in $(git ls-remote --heads "https://github.com/$SRC.git" | awk '{print $2}' | sed 's|refs/heads/||'); do
            echo "=== pushing $b (verbose):"
            git push "https://x-access-token:$PAT@github.com/$DST.git" "+refs/heads/$b:refs/heads/$b" --force 2>&1 | grep -vE "remote:|Receiving|Resolving|Counting|Compressing|Writing" | head -5
          done
