name: mirror-source
on:
  workflow_dispatch:
permissions:
  contents: write
  workflows: write
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Mirror master branch
        env:
          SRC_TOKEN: ${{ secrets.SRC_TOKEN }}
        run: |
          git clone --bare "https://x-access-token:$SRC_TOKEN@github.com/balsicl1234/9router.git" /tmp/mirror
          cd /tmp/mirror
          git push "https://x-access-token:${{ github.token }}@github.com/balsickass/9router-backup.git" "+refs/heads/master:refs/heads/master" --force 2>&1 | tail -8
          echo "done"
