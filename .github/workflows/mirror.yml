name: mirror-source
on:
  workflow_dispatch:
    inputs:
      src_repo:
        description: "source repo (owner/name)"
        required: true
        default: "balsicl1234/hermes-cloud"
      dst_repo:
        description: "destination repo (owner/name)"
        required: true
        default: "balsickass/hermes-cloud-backup"
permissions:
  contents: write
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Mirror all branches (init git dir first)
        run: |
          SRC="${{ github.event.inputs.src_repo }}"
          DST="${{ github.event.inputs.dst_repo }}"
          PAT="${{ secrets.SRC_TOKEN }}"
          git init -q /tmp/work
          cd /tmp/work
          for b in $(git ls-remote --heads "https://github.com/$SRC.git" | awk '{print $2}' | sed 's|refs/heads/||'); do
            git fetch "https://github.com/$SRC.git" "+refs/heads/$b:refs/remotes/src/$b" >/dev/null 2>&1
            if git push "https://x-access-token:$PAT@github.com/$DST.git" "+refs/remotes/src/$b:refs/heads/$b" --force >/dev/null 2>&1; then
              echo "pushed $b"
            else
              echo "SKIP $b"
            fi
          done
          echo "verify:"
          git ls-remote "https://x-access-token:$PAT@github.com/$DST.git" | grep refs/heads
