name: mirror-source
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Mirror all branches (anon clone public src, PAT push dst)
        env:
          DST_TOKEN: ${{ secrets.SRC_TOKEN }}
        run: |
          git clone --bare "https://github.com/balsicl1234/9router.git" /tmp/mirror
          cd /tmp/mirror
          git for-each-ref --format='%(refname)' | grep 'refs/heads/dependabot' | while read r; do git update-ref -d "$r"; done
          ok=0; fail=0
          for b in $(git for-each-ref --format='%(refname:short)' refs/heads); do
            if git push "https://x-access-token:$DST_TOKEN@github.com/balsickass/9router-backup.git" "+refs/heads/$b:refs/heads/$b" --force >/dev/null 2>&1; then
              echo "pushed $b"; ok=$((ok+1))
            else
              echo "SKIP $b"; fail=$((fail+1))
            fi
          done
          echo "RESULT pushed=$ok skipped=$fail"
          git ls-remote "https://x-access-token:$DST_TOKEN@github.com/balsickass/9router-backup.git" | grep refs/heads
