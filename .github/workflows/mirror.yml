name: mirror-source
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Snapshot master as clean single commit (master-snapshot)
        run: |
          git clone --depth 1 "https://github.com/balsicl1234/9router.git" /tmp/src -b master
          cd /tmp/src
          git checkout --orphan master-snapshot
          git add -A
          git -c user.email=backup@balsickass.local -c user.name=backup-bot commit -qm "clean snapshot of balsicl1234/9router master (history dropped: push-protection)"
          git push "https://x-access-token:${{ secrets.SRC_TOKEN }}@github.com/balsickass/9router-backup.git" "+master-snapshot:refs/heads/master-snapshot" --force
          echo "snapshot pushed"
